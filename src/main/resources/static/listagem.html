<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Paldea - pagina de listagem usando repeticao.">
    <title>Paldea | Listagem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand-chip">Paldea Jardim</div>
        <nav class="menu">
            <a href="index.html">Login</a>
            <a href="condicional.html">Condicional</a>
            <a href="listagem.html" class="active">Listagem</a>
            <a href="crud.html">CRUD</a>
        </nav>
    </header>

    <main class="page-shell">
        <section class="hero-card">
            <span class="mini-label">Pagina usando repeticao</span>
            <h1>Catalogo visual da Paldea</h1>
            <p>
                Os cards abaixo sao criados com um `for` simples para simular a futura listagem de itens do banco.
            </p>
        </section>

        <section class="panel">
            <h2>Plantas em exibicao</h2>
            <div id="gradePlantas" class="cards-grid"></div>
        </section>
    </main>

    <script>
        const plantas = [
            { nome: 'Samambaia', categoria: 'Folhagem', preco: 'R$ 25,90' },
            { nome: 'Rosa Vermelha', categoria: 'Flores', preco: 'R$ 18,50' },
            { nome: 'Lavanda', categoria: 'Aromaticas', preco: 'R$ 22,00' },
            { nome: 'Manjericao', categoria: 'Ervas', preco: 'R$ 8,90' },
            { nome: 'Suculenta Echeveria', categoria: 'Suculentas', preco: 'R$ 15,00' },
            { nome: 'Palmeira Rafis', categoria: 'Palmeiras', preco: 'R$ 89,90' }
        ];

        const grade = document.getElementById('gradePlantas');
        let cards = '';

        for (let i = 0; i < plantas.length; i++) {
            cards += `
                <article class="plant-card">
                    <span class="tag">${plantas[i].categoria}</span>
                    <h3>${plantas[i].nome}</h3>
                    <p>Item visual repetido para demonstrar o layout da listagem.</p>
                    <strong>${plantas[i].preco}</strong>
                </article>
            `;
        }

        grade.innerHTML = cards;
    </script>
</body>
</html>
