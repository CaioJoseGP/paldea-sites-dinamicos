<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Paldea - pagina condicional usando if.">
    <title>Paldea | Pagina Condicional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand-chip">Paldea Jardim</div>
        <nav class="menu">
            <a href="index.html">Login</a>
            <a href="condicional.html" class="active">Condicional</a>
            <a href="listagem.html">Listagem</a>
            <a href="crud.html">CRUD</a>
        </nav>
    </header>

    <main class="page-shell">
        <section class="hero-card">
            <span class="mini-label">Pagina usando condicao</span>
            <h1>Oferta especial do dia</h1>
            <p>
                Esta tela mostra como o site muda visualmente quando a promocao esta ativa ou inativa.
            </p>
        </section>

        <section class="panel-grid">
            <article class="panel">
                <h2>Controle visual</h2>
                <p>Use o seletor abaixo para simular a regra da pagina.</p>

                <label for="statusPromocao">Status da promocao</label>
                <select id="statusPromocao">
                    <option value="ativa">Promocao ativa</option>
                    <option value="inativa">Promocao inativa</option>
                </select>
            </article>

            <article class="panel" id="painelCondicional">
                <h2>Resultado do if</h2>
                <div id="resultadoCondicional"></div>
            </article>
        </section>
    </main>

    <script>
        const seletor = document.getElementById('statusPromocao');
        const resultado = document.getElementById('resultadoCondicional');

        function renderizarCondicao() {
            const status = seletor.value;

            if (status === 'ativa') {
                resultado.innerHTML = `
                    <div class="condition-box success">
                        <strong>Promocao ativa:</strong>
                        <p>Hoje as suculentas estao com 20% de desconto e ganham destaque na vitrine.</p>
                        <a class="btn btn-primary" href="listagem.html">Ver plantas em destaque</a>
                    </div>
                `;
            } else {
                resultado.innerHTML = `
                    <div class="condition-box neutral">
                        <strong>Promocao inativa:</strong>
                        <p>No momento a vitrine mostra apenas a mensagem padrao e os produtos seguem com preco normal.</p>
                        <a class="btn btn-secondary" href="listagem.html">Ver catalogo completo</a>
                    </div>
                `;
            }
        }

        seletor.addEventListener('change', renderizarCondicao);
        renderizarCondicao();
    </script>
</body>
</html>
